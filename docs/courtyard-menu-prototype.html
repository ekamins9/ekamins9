<title>Courtyard Menu Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: a fixed game-menu shell (sidebar · stage · right column) over a courtyard backdrop; one dark look by design. */
:root{
  --bg:#141210; --bg2:#1c1916; --panel:rgba(22,20,18,.92); --card:#2a2622; --card2:#383229; --sel:#5e4b2b;
  --fg:#ece5d6; --dim:#a39a8a; --line:rgba(196,150,70,.45); --gold:#c99a48; --gold2:#ffd277;
  --red:#b23e2e; --red2:#d35243; --green:#6aa864; --blue:#4a62a8; --iron:#c83c32; --crown:#e8b84a; --mark:#9aa4b0;
  --display:"Cinzel",Georgia,serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
input,select{font-family:inherit;font-size:13px;color:var(--fg);background:#100e0c;border:1px solid #3a342c;border-radius:6px;padding:6px 8px}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr}
.world{position:absolute;inset:0;background:radial-gradient(ellipse at 60% 60%,#3e3528 0%,#1b1714 45%,#0d0b09 100%)}
.world:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 80px),repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 2px,transparent 2px 60px);mask:linear-gradient(180deg,transparent,#000 40%)}
.topbar{position:relative;display:flex;align-items:flex-start;justify-content:space-between;padding:18px 24px 0;gap:12px;z-index:3}
h1{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:2px;color:var(--gold);margin:0}
.sub{color:var(--dim);font-size:13px;margin-top:4px}
.wallet{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.coin{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.4);font-weight:700;font-variant-numeric:tabular-nums}
.coin i{width:13px;height:13px;border-radius:50%;display:inline-block}
.coin.marks i{background:var(--mark)}.coin.crowns i{background:var(--crown)}
.shell{position:relative;display:grid;grid-template-columns:190px 1fr;gap:16px;padding:10px 24px 24px;min-height:0;z-index:2}
.side{display:flex;flex-direction:column;gap:6px;min-height:0}
.tab{padding:11px 14px;border-radius:6px;background:var(--card);font-weight:700;text-align:left;color:var(--dim);letter-spacing:.5px;transition:background .15s}
.tab:hover{background:var(--card2);color:var(--fg)}.tab.on{background:var(--sel);color:var(--fg)}
.side .grow{flex:1}
.h{font-weight:700;font-size:12px;letter-spacing:1px;color:var(--fg);margin:0 0 8px}
.mode .card{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;background:var(--card);margin-top:6px;font-weight:700;font-size:12px;color:var(--dim)}
.mode .card small{display:block;font-weight:400;font-size:10.5px;color:#7e7568}
.mode .card.on{background:var(--sel);color:var(--fg);outline:1.5px solid var(--gold)}.mode .card.on small{color:#d8c9a6}
.btn{display:block;width:100%;padding:11px;border-radius:6px;font-weight:800;font-size:13px;text-align:center;background:var(--card);color:var(--fg);transition:transform .08s,background .15s}
.btn:hover{background:var(--card2)}.btn:active{transform:scale(.98)}
.btn.go{background:var(--red)}.btn.go:hover{background:var(--red2)}
.btn.gold{background:var(--gold);color:#1a1612}.btn.gold:hover{background:var(--gold2)}
.btn.sm{padding:6px 10px;font-size:11px;width:auto;display:inline-block}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.content{position:relative;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.content>*,.shell>*,.stagewrap,.stagewrap>*{min-width:0}
.content.full{grid-template-columns:1fr}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:0;overflow:auto}
.panel.quiet{border-color:rgba(255,255,255,.08)}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.stagewrap{position:relative;min-height:0;display:grid;grid-template-rows:auto 1fr auto;gap:8px}
.stage{position:relative;min-height:300px;display:flex;justify-content:center;align-items:flex-end;gap:28px;perspective:900px;cursor:grab;user-select:none}
.stage:active{cursor:grabbing}
.mate{position:relative;width:170px;transition:transform .12s;transform-style:preserve-3d}
.mate .tag{position:absolute;left:50%;transform:translateX(-50%);top:-6px;padding:4px 9px;border-radius:5px;background:rgba(0,0,0,.65);font-size:11px;font-weight:700;white-space:nowrap}
.mate svg{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 12px rgba(0,0,0,.6))}
.mate.ghost{opacity:.45}
.hint{color:var(--dim);font-size:12px;text-align:center}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);border-radius:6px;margin-bottom:6px;font-size:13px;width:100%;text-align:left}
button.row:hover{background:var(--card2)}
.row.on{background:var(--sel);outline:1.5px solid var(--gold)}
.row .r{margin-left:auto;display:flex;align-items:center;gap:6px;font-weight:700;font-size:12px;color:var(--dim)}
.row .r i{width:10px;height:10px;border-radius:50%;display:inline-block}
.i-m{background:var(--mark)}.i-c{background:var(--crown)}
.dim{color:var(--dim);font-size:12px}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border-radius:4px;border:1px solid rgba(255,255,255,.15);position:relative}
.sw button.on{outline:2px solid #fff;outline-offset:1px}
.sw button.lock:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(0,0,0,.45) 0 3px,transparent 3px 6px);border-radius:4px}
.rar{font-size:10px;font-weight:800;letter-spacing:1px;padding:2px 6px;border-radius:3px;color:#fff}
.r-Common{background:#5d6b7a}.r-Rare{background:#2f6fb0}.r-Epic{background:#7a3fb0}.r-Legendary{background:var(--gold);color:#1a1612}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:7px 12px;border-radius:6px;background:var(--card);font-weight:700;font-size:12px;color:var(--dim)}
.chip.on{background:var(--sel);color:var(--fg)}
.lb .r{display:flex;gap:8px;font-size:12px;padding:6px 8px;border-radius:5px;background:rgba(0,0,0,.3);margin-bottom:4px;font-variant-numeric:tabular-nums}
.lb .r b{width:26px;color:var(--gold)}.lb .r span{flex:1}.lb .r i{font-style:normal;color:var(--dim)}
.lb .r.me{background:var(--sel)}
.rank{display:inline-block;padding:3px 8px;border-radius:4px;font-weight:900;font-size:11px;letter-spacing:1px;background:#8a7a4a;color:#1a1612}
.bar{height:8px;border-radius:4px;background:#000;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
.grid{display:grid;gap:10px}
.toasts{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:50;pointer-events:none}
.toast{padding:8px 16px;border-radius:8px;background:rgba(22,20,18,.95);border:1px solid var(--gold);font-weight:700;font-size:13px;animation:up .25s ease-out}
.toast.good{border-color:var(--green)}.toast.bad{border-color:var(--red2)}.toast.rare{border-color:var(--gold2);color:var(--gold2)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{width:min(480px,100%);background:#1b1917;border:1px solid var(--gold);border-radius:12px;padding:20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.7);max-height:90vh;overflow:auto}
.modal .x{position:absolute;right:12px;top:10px;width:28px;height:28px;border-radius:6px;background:var(--card);font-weight:800}
.modal h3{font-family:var(--display);font-size:15px;letter-spacing:1px;margin:0 0 8px;color:var(--gold)}
.travel{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.travel .t{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:4px;color:var(--gold)}
.travel .d{font-size:18px;font-weight:700}
.travel .track{width:min(420px,80vw);height:6px;border-radius:3px;background:#1e1b18;overflow:hidden;position:relative;margin-top:16px}
.travel .track i{position:absolute;top:0;width:35%;height:100%;background:var(--gold);border-radius:3px;animation:sweep 1.6s linear infinite}
@keyframes sweep{from{left:-35%}to{left:100%}}
.travel .tip{position:absolute;bottom:60px;max-width:640px;color:var(--dim);font-size:16px;padding:0 16px}
.travel .tip b{display:block;font-size:11px;letter-spacing:1px;color:var(--gold);margin-bottom:8px}
.sel-row{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-radius:5px;background:var(--card);font-size:12px;margin-bottom:6px;gap:8px}
.sel-row b{color:var(--fg)}
.tog{width:34px;height:18px;border-radius:9px;background:#3a3630;position:relative;flex:none}
.tog.on{background:var(--green)}.tog:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:left .15s}.tog.on:after{left:18px}
.drum{position:relative;height:250px;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.drum .mark{position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--gold);box-shadow:0 0 12px var(--gold);z-index:2}
.drum .strip{position:absolute;left:0;top:30px;display:flex;gap:18px;will-change:transform}
.dcard{width:150px;height:190px;border-radius:8px;background:var(--card);border:2px solid #555;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px;font-weight:800;font-size:12px;text-align:center;gap:6px;flex:none}
.dcard svg{width:70px;height:110px}
.match{position:fixed;inset:0;z-index:30;background:radial-gradient(ellipse at 50% 60%,#4a4034,#141210)}
.hud{position:absolute;left:24px;bottom:24px;width:284px;background:rgba(18,18,22,.65);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:10px}
.hud .bar{height:18px;border-radius:8px;background:rgba(0,0,0,.5)}.hud .bar i{border-radius:8px}
.hud .hp i{background:#69cd78}.hud .st i{background:#ebbe50}
.strip-top{position:absolute;left:50%;top:14px;transform:translateX(-50%);text-align:center;font-weight:800}
.feed{position:absolute;right:20px;top:48px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.feed div{background:rgba(24,22,20,.65);padding:4px 10px;border-radius:6px;font-size:13px}
.ctrl{position:absolute;right:20px;bottom:24px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:400px}
.key{display:inline-block;padding:1px 6px;border:1px solid #555;border-radius:4px;font-size:11px;font-weight:700;background:#000}
.courtyard{position:fixed;inset:0;z-index:1}
.courtyard .note{position:absolute;left:24px;bottom:24px;color:var(--dim);font-weight:700}
.courtyard .scene{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:40px;padding-bottom:12vh}
.pressed{outline:3px solid var(--gold2);box-shadow:0 0 0 6px rgba(255,210,119,.2)}
.tabs2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs2 button{padding:8px 14px;border-radius:6px;background:var(--card);font-weight:800;font-size:12px;color:var(--dim)}
.tabs2 button.on{background:var(--sel);color:var(--fg)}
.cls{display:flex;gap:8px;margin-bottom:10px}
.cls button{flex:1;padding:10px;border-radius:8px;background:var(--card);font-weight:800;color:var(--dim)}
.cls button small{display:block;font-weight:600;font-size:10px}
.cls button.on{background:var(--gold);color:#1a1612}
.pack{border-radius:8px;height:120px;display:flex;align-items:flex-end;padding:10px;font-weight:900;font-size:15px;text-align:left;color:#fff;text-shadow:0 1px 2px #000}
.pack small{display:block;font-size:10px;font-weight:600;opacity:.9}
.srv{display:grid;grid-template-columns:2fr 1.4fr 1fr .8fr .6fr auto;gap:8px;align-items:center;padding:8px 10px;border-radius:6px;background:var(--card);margin-bottom:6px;font-size:12px}
.srv.head{background:none;color:var(--dim);font-weight:800;font-size:11px}
.srv.full .n{color:var(--red2)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:900px){.shell{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap}.side .grow{display:none}.content{grid-template-columns:1fr}.mode{width:100%}.srv{grid-template-columns:1fr 1fr;font-size:11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="world"></div>
<div id="app"></div>
<div class="toasts" id="toasts"></div>
<div id="layer"></div>

<script>
/* ========================= CATALOG ========================= */
const WEIGHTS={Light:{health:0,speed:100,clunk:100,prot:10},Medium:{health:25,speed:94,clunk:115,prot:30},Heavy:{health:50,speed:86,clunk:140,prot:50}};
const CLASSES={Knight:{weight:"Heavy",desc:"Plate from head to toe. Slow, hard to cut, hits like a wall falling on you."},Footman:{weight:"Medium",desc:"Mail and gambeson. The all-rounder."},Vanguard:{weight:"Light",desc:"No armor to speak of. Fast, long reach, one mistake from death."}};
const PACKS={
  Starter_H:{name:"Plate & Mail",weight:"Heavy",free:true,bg:"linear-gradient(135deg,#3a3a3a,#5a5a5a)"},
  IronCrow:{name:"The Iron Crow",weight:"Heavy",featured:true,bg:"linear-gradient(135deg,#3a2f22,#6a4d2a)"},
  RustedWatch:{name:"The Rusted Watch",weight:"Heavy",bg:"linear-gradient(135deg,#4a2a1a,#7a4a2a)"},
  Starter_M:{name:"Mail & Gambeson",weight:"Medium",free:true,bg:"linear-gradient(135deg,#3b3630,#5a5248)"},
  GildedCourt:{name:"The Gilded Court",weight:"Medium",bg:"linear-gradient(135deg,#3a3522,#8a7a2a)"},
  RoadWardens:{name:"Road Wardens",weight:"Medium",bg:"linear-gradient(135deg,#2a3a2a,#4a6a3a)"},
  Starter_L:{name:"Peasant",weight:"Light",free:true,bg:"linear-gradient(135deg,#5a4a3a,#7a6a5a)"},
  MarshWardens:{name:"Marsh Wardens",weight:"Light",bg:"linear-gradient(135deg,#223a2f,#2a6a4d)"},
  NightRunners:{name:"Night Runners",weight:"Light",bg:"linear-gradient(135deg,#1a1a2a,#3a3a6a)"},
};
// look: helmet type: greathelm (covers hair+face) · sallet (hair) · bascinet (hair) · hood (hair) · cap (hair) · circlet (none) · none
const PIECES=[
  // Heavy
  P("PlateHelm","Plate Helm","helmet","Starter_H","Common",0,0,{type:"bascinet",covers:["Hair"],metal:true}),
  P("PlateCuirass","Plate Cuirass","top","Starter_H","Common",0,0,{plate:true}),
  P("PlateLegs","Plate Legs","bottom","Starter_H","Common",0,0,{greaves:true}),
  P("CrowGreatHelm","Crow Great Helm","helmet","IronCrow","Rare",700,35,{type:"greathelm",covers:["Hair","Face"],metal:true,crest:true}),
  P("CrowCuirass","Crow Cuirass","top","IronCrow","Rare",800,40,{plate:true,pauldrons:true}),
  P("CrowGreaves","Crow Greaves","bottom","IronCrow","Rare",600,30,{greaves:true}),
  P("RustedBascinet","Rusted Bascinet","helmet","RustedWatch","Common",700,35,{type:"bascinet",covers:["Hair"],metal:true,rust:true}),
  P("RustedBrigandine","Rusted Brigandine","top","RustedWatch","Common",800,40,{plate:true,rust:true}),
  P("RustedChausses","Rusted Chausses","bottom","RustedWatch","Common",600,30,{greaves:true,rust:true}),
  P("Sallet","Sallet","helmet","IronCrow","Epic",900,45,{type:"sallet",covers:["Hair"],metal:true}),
  // Medium
  P("Kettle","Kettle Hat","helmet","Starter_M","Common",0,0,{type:"cap",covers:["Hair"],metal:true}),
  P("Gambeson","Gambeson & Mail","top","Starter_M","Common",0,0,{mail:true}),
  P("Hose","Wool Hose","bottom","Starter_M","Common",0,0,{}),
  P("GildedBarbute","Gilded Barbute","helmet","GildedCourt","Epic",900,45,{type:"bascinet",covers:["Hair"],metal:true,gilt:true}),
  P("CourtDoublet","Court Doublet","top","GildedCourt","Epic",900,45,{mail:true,gilt:true}),
  P("CourtHose","Court Hose","bottom","GildedCourt","Epic",700,35,{gilt:true}),
  P("WardenHood","Warden's Hood","helmet","RoadWardens","Rare",600,30,{type:"hood",covers:["Hair"]}),
  P("WardenCoat","Warden's Coat","top","RoadWardens","Rare",700,35,{mail:true,coat:true}),
  P("WardenBoots","Warden's Boots","bottom","RoadWardens","Rare",500,25,{boots:true}),
  // Light
  P("Bare","Bare Head","helmet","Starter_L","Common",0,0,{type:"none",covers:[]}),
  P("Tunic","Linen Tunic","top","Starter_L","Common",0,0,{}),
  P("Breeches","Breeches","bottom","Starter_L","Common",0,0,{}),
  P("MarshCowl","Marsh Cowl","helmet","MarshWardens","Rare",600,30,{type:"hood",covers:["Hair"]}),
  P("MarshJerkin","Marsh Jerkin","top","MarshWardens","Rare",700,35,{leather:true}),
  P("MarshWraps","Marsh Wraps","bottom","MarshWardens","Rare",500,25,{boots:true}),
  P("RunnerMask","Runner's Mask","helmet","NightRunners","Epic",800,40,{type:"mask",covers:["Face"]}),
  P("RunnerVest","Runner's Vest","top","NightRunners","Epic",800,40,{leather:true}),
  P("RunnerLeggings","Runner's Leggings","bottom","NightRunners","Epic",600,30,{}),
  P("Circlet","Iron Circlet","helmet","MarshWardens","Legendary",1500,75,{type:"circlet",covers:[]}),
];
function P(id,name,slot,pack,rarity,marks,crowns,look){return {id,name,slot,pack,weight:PACKS[pack].weight,rarity,marks,crowns,look}}
const PIECE=Object.fromEntries(PIECES.map(p=>[p.id,p]));
const WEAPONS=[
  W("Shortsword","Shortsword",{kind:"sword",len:120},{free:true},"OneHanded",true),
  W("Pitchfork","Pitchfork",{kind:"pole",len:200},{free:true},"Polearm",false),
  W("Greatsword","Greatsword",{kind:"sword",len:190},{level:5,marks:1500},"TwoHanded",false),
  W("Hammer","War Hammer",{kind:"hammer",len:130},{kills:40,family:"OneHanded",marks:1500},"OneHanded",true),
  W("Halberd","Halberd",{kind:"pole",len:220},{kills:60,family:"Polearm",marks:2500},"Polearm",false),
  W("Zweihander","Zweihander",{kind:"sword",len:210},{level:12,marks:2500},"TwoHanded",false),
];
function W(id,name,look,unlock,family,secondary){return {id,name,look,unlock,family,secondary}}
const WEAPON=Object.fromEntries(WEAPONS.map(w=>[w.id,w]));
const SKINS=[
  S("Greatsword","Default","Common",null,"#d8dbe0","#8b6a3a"),S("Greatsword","Blackened","Rare","Bladesmith","#3a3d44","#2a2a2a"),S("Greatsword","Gilded","Legendary","Bladesmith","#f2e2b0","#c99a48"),S("Greatsword","Veteran","Epic","earned","#b8c0c8","#6a2a2a"),
  S("Shortsword","Default","Common",null,"#d8dbe0","#5a3a1a"),S("Shortsword","Pitted","Common","Bladesmith","#9a9a8a","#4a3a2a"),S("Shortsword","Bluesteel","Rare","Bladesmith","#8aa8d8","#2a2a4a"),S("Shortsword","Crowfeather","Epic","Bladesmith","#2a2a30","#c99a48"),
  S("Hammer","Default","Common",null,"#9a9a9a","#5a3a1a"),S("Hammer","Blackened","Rare","Hafted","#3a3d44","#2a2a2a"),S("Hammer","Bronze","Epic","Hafted","#c88a4a","#4a2a1a"),
  S("Halberd","Default","Common",null,"#d8dbe0","#6a4a2a"),S("Halberd","Marshsteel","Rare","Hafted","#6a8a6a","#3a4a2a"),S("Halberd","Gilded","Legendary","Hafted","#f2e2b0","#c99a48"),
  S("Pitchfork","Default","Common",null,"#8a8a8a","#7a5a3a"),S("Pitchfork","Ember","Rare","Hafted","#d86a3a","#3a2a1a"),
  S("Zweihander","Default","Common",null,"#d8dbe0","#3a2a1a"),S("Zweihander","Nightsteel","Epic","Bladesmith","#2a2a44","#1a1a2a"),
];
function S(weapon,name,rarity,crate,blade,grip){return {id:weapon+":"+name,weapon,name,rarity,crate,blade,grip}}
const SKIN=Object.fromEntries(SKINS.map(s=>[s.id,s]));

function colorHex(name){return (COLOR[name]||COLOR.Slate).hex}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f);return"#"+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("")}

  if(armor&&tl.plate){s+=`<rect x="66" y="92" width="68" height="100" rx="8" fill="${prim}" opacity=".0"/><path d="M78 100h44v40q-22 14-44 0z" fill="${prim}"/><rect x="92" y="150" width="16" height="42" rx="3" fill="${acc}"/>`}
  else if(armor&&tl.mail){s+=`<rect x="66" y="92" width="68" height="100" rx="8" fill="${prim}"/><rect x="66" y="92" width="68" height="100" rx="8" fill="url(#mail)"/><rect x="70" y="150" width="60" height="8" fill="${acc}"/>`}
  else if(armor&&tl.leather){s+=`<rect x="74" y="96" width="52" height="94" rx="6" fill="${prim}" opacity=".85"/><rect x="70" y="150" width="60" height="8" fill="${acc}"/>`}

  const armc=armor?(tl.plate?metal:(tl.mail?prim:(tl.leather?skin:prim))):skin;

    if(app.beard!=="None"){const h=app.beard==="Stubble"?10:(app.beard==="Braided"?30:22);s+=`<path d="M76 56v${h}q24 14 48 0v-${h}q-24 10 -48 0z" fill="${hairc}" opacity="${app.beard==="Stubble"?.55:1}"/>`;if(app.beard==="Braided")s+=`<rect x="96" y="80" width="8" height="18" rx="3" fill="${hairc}"/>`}}

  const drumW=$("#drum").clientWidth;const target=-(idx*168+75-drumW/2);strip.style.transition="none";strip.style.transform="translateX(0)";requestAnimationFrame(()=>{strip.style.transition="transform 4s cubic-bezier(.12,.8,.2,1)";strip.style.transform=`translateX(${target}px)`});

    case"team":ui.team=ui.team===0?"A":(ui.team==="A"?"B":0);render();break;
    case"saveClass":st.classes[ui.editing]=JSON.parse(JSON.stringify(ui.classEdit));ui.dirty=false;save();render();toast(`${ui.editing} saved`,"good");break;
    case"setActive":st.active=ui.editing;save();render();toast(`Spawning as ${st.active}`,"good");break;
    case"shopTab":ui.shopTab=v;render();break;case"crate":ui.crate=v;render();break;
    case"openCrate":flash();openCrate();break;case"openCrateGo":rollCrate();break;
    case"equipSkin":{const s=SKIN[v];const lo=st.classes[st.active];if(lo.weapon===s.weapon){lo.weaponSkin=v;toast(`${s.name} equipped on your ${WEAPON[s.weapon].name}`,"good")}else if(lo.secondary===s.weapon){lo.secondarySkin=v;toast("Equipped on your secondary","good")}else toast(`${st.active} isn't carrying a ${WEAPON[s.weapon].name}; pick it in Classes`,"bad");save();closeModal();break}
    case"packDetail":packDetail(v);break;
    case"buyPack":{const pieces=PIECES.filter(x=>x.pack===v&&!pieceOwned(x.id));const sumM=Math.round(pieces.reduce((a,x)=>a+x.marks,0)*.85),sumC=Math.round(pieces.reduce((a,x)=>a+x.crowns,0)*.85);const ok=b.dataset.cur==="marks"?pay(sumM,0):pay(0,sumC);if(!ok)break;pieces.forEach(x=>st.owned.pieces.push(x.id));save();closeModal();render();toast(`${PACKS[v].name} bought`,"good");break}
    case"goClasses":closeModal();st.tab="classes";ui.classEdit=null;ui.dirty=false;ui.editing=st.active;render();break;
    case"buyWeapon":{const w=WEAPON[v];if(!pay(w.unlock.marks,0))break;st.owned.weapons.push(v);save();render();toast(`${w.name} unlocked`,"good");break}
    case"getCrowns":modal(`<h3>GET CROWNS</h3><div class="grid" style="grid-template-columns:1fr 1fr 1fr">${[[100,99,""],[550,499,"+10%"],[1200,999,"+20%"]].map(([c,r,b2],i)=>`<button class="btn ${i===1?"gold":""}" style="padding:14px" data-act="buyCrowns" data-v="${c}">${c}<br><span style="font-size:11px;font-weight:600">${r} R$ ${b2}</span></button>`).join("")}</div><div class="dim" style="margin-top:10px">Opens Roblox's purchase prompt in the real game; here it just credits you.</div><p class="h" style="margin-top:16px">MARKS FOR CROWNS</p><div class="grid" style="grid-template-columns:1fr 1fr 1fr">${[[500,30],[1200,60],[3000,120]].map(([m,c])=>`<button class="btn" style="padding:12px" data-act="exchange" data-v="${m}" data-c="${c}">${fmt(m)} Marks<br><span style="font-size:11px;font-weight:600">${c} Crowns</span></button>`).join("")}</div><div class="dim" style="margin-top:8px">One way only: Crowns never come back out of Marks.</div>`);break;
    case"buyCrowns":st.wallet.crowns+=+v;save();closeModal();render();toast(`+${v} Crowns`,"good");break;
    case"exchange":if(!pay(0,+b.dataset.c))break;st.wallet.marks+=+v;save();closeModal();render();toast(`+${fmt(+v)} Marks for ${b.dataset.c} Crowns`,"good");break;
    case"filter":ui.filters[v]=!ui.filters[v];render();break;case"filterDoor":ui.filters.door=v;ui.customFromPlay=false;render();break;
    case"refresh":ui.servers=genServers();render();toast("Server list refreshed");break;
    case"customToggle":ui.customOpen=!ui.customOpen;render();break;
    case"customTog":st.custom[b.dataset.k]=!st.custom[b.dataset.k];save();render();break;
    case"joinServer":{const s=ui.servers.find(x=>x.id===v);if(s.n>=s.max){toast("That server is full · try QUICK JOIN for the next one with room","bad");break}if(s.n+st.party.length+1>s.max){toast("No room for your whole party there","bad");break}travel(`${s.name} · ${s.mode} · ${s.map}`,()=>startMatch({title:s.mode.toUpperCase()+" · "+s.map.toUpperCase(),sub:s.custom?`custom server${s.cheats?" · cheats on · no rewards":""}`:"round 1 of 3",teams:s.mode!=="Free-for-all",cheats:s.cheats,a:0,b:0}));break}
    case"inviteCode":modal(`<h3>INVITE CODE</h3><div class="dim">Ket's sandbox is invite only. Ask Ket for the six-letter code.</div><input id="code" style="width:100%;margin:12px 0;font-size:20px;letter-spacing:8px;text-align:center;font-weight:900" maxlength="6" placeholder="______"><button class="btn gold" data-act="codeGo">JOIN</button>`,l=>l.querySelector("#code").focus());break;
    case"codeGo":{const c=$("#code").value.toUpperCase();if(c==="BRAVOK"){closeModal();travel("Ket's sandbox · cheats on",()=>startMatch({title:"FREE-FOR-ALL · VILLAGE",sub:"Ket's sandbox · cheats on · no rewards",teams:false,cheats:true,foe:"KET"}))}else toast("Wrong code","bad");break}
    case"reserve":{const c=st.custom;const name=c.name||st.profile.name+"'s server";travel(`${name} · ${c.mode} · ${c.map} · new server`,()=>startMatch({title:c.mode.toUpperCase()+" · "+c.map.toUpperCase(),sub:`your custom server · ${c.access.toLowerCase()}${c.cheats?" · cheats on · no rewards":""}`,teams:c.mode!=="Free-for-all"&&c.door==="Warfront",cheats:c.cheats}));ui.customOpen=false;break}
    case"openMenu":st.where="menu";render();break;
    case"duel":toast("Ket accepts · both pulled into the duel circle","good");setTimeout(()=>startMatch({title:"HONOR DUEL · COURTYARD",sub:"first to 3 · the ring is closed to everyone else",teams:false,lists:true,ranked:false,bracket:"1v1",foe:"KET"}),800);break;
    case"simKill":{const m=ui.match;m.kills++;m.a++;m.st=Math.max(0,m.st-12);feedLine(`<b style="color:var(--blue)">You</b> <span style="color:var(--red2)">cut down</span> <b style="color:var(--iron)">${m.foe||"Oswin"}</b>`);const h=$(".hud .st i");if(h)h.style.width=m.st+"%";if(m.lists&&m.a>=3){endMatch()}else render();break}
    case"simParry":{const m=ui.match;m.parries++;m.st=Math.min(100,m.st+6);toast("PARRY ×"+m.parries+" +6","good");render();break}
    case"simHit":{const m=ui.match;m.hp=Math.max(0,m.hp-35);if(m.hp===0){m.deaths++;m.b++;m.hp=100;m.st=100;feedLine(`<b style="color:var(--iron)">${m.foe||"Halvard"}</b> <span style="color:var(--red2)">skewered</span> <b style="color:var(--blue)">You</b>`);toast(m.lists?"Round lost":"You died · respawning in 6","bad");if(m.lists&&m.b>=3){endMatch();break}}render();break}
    case"endMatch":endMatch();break;
    case"pause":ui.pause=!ui.pause;render();break;case"board":ui.board=!ui.board;ui.pause=false;render();break;case"vote":toast("Vote counted · Siege");break;
    case"leaveMatch":clearInterval(feedTimer);if(ui.match.lists&&ui.match.ranked){st.profile.rating[ui.match.bracket]-=20;toast("Left a ranked match · -20 · queue locked 10 min","bad")}st.where="menu";st.tab="play";render();break;
    case"rematch":closeModal();toast("Waiting for the other side to accept… (1 / 2)");break;case"stay":closeModal();toast("Next round: Siege on Bridge");break;
    case"closeModal":closeModal();break;
    case"reset":try{localStorage.removeItem("courtyard-proto")}catch(e){}st=DEF();ui.classEdit=null;ui.appDraft=null;render();toast("Prototype reset");break;
  }});
function confirmSwitch(){return true}
document.addEventListener("change",e=>{const el=e.target.closest("[data-act=custom]");if(!el)return;const k=el.dataset.k;let v=el.value;if(k==="limit")v=+v;st.custom[k]=v;if(k==="door"){st.custom.mode=v==="Lists"?"1v1 casual":(v==="Courtyard"?"Hub":"Free-for-all");st.custom.map=v==="Lists"?"The Pit":(v==="Courtyard"?"Courtyard":"Bridge")}save();render()});
document.addEventListener("input",e=>{if(e.target.id==="c_name"){st.custom.name=e.target.value}});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.key==="m"||e.key==="M"){if(st.where==="courtyard"){st.where="menu";render()}else if(st.where==="match"){ui.pause=!ui.pause;ui.board=false;render()}else if($("#layer").innerHTML){closeModal()}else if(ui.customOpen){ui.customOpen=false;render()}else if(st.where==="menu"&&st.door==="courtyard"&&!st.party.length){st.where="courtyard";render()}}
  if(e.key==="Tab"&&st.where==="match"){e.preventDefault();if(!ui.board){ui.board=true;render()}}});
document.addEventListener("keyup",e=>{if(e.key==="Tab"&&st.where==="match"&&ui.board){ui.board=false;render()}});
render();
</script>
